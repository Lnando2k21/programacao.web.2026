<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="tag">PRÁTICA 3 · PROGRAMAÇÃO WEB</p>
            <h1>Controle de Gastos</h1>
            <p>Cadastre seus gastos e mantenha os registros salvos no navegador.</p>
        </header>

        <section class="card">
            <h2>Novo gasto</h2>

            <form id="formGasto">
                <div class="form-grid">
                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Ex.: Supermercado" required>
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="">Selecione</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Educação">Educação</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="valor">Valor (R$)</label>
                        <input type="number" id="valor" min="0.01" step="0.01" placeholder="0,00" required>
                    </div>

                    <div class="campo">
                        <label for="data">Data</label>
                        <input type="date" id="data" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Adicionar gasto</button>
            </form>
        </section>

        <section class="card">
            <div class="lista-header">
                <div>
                    <h2>Gastos cadastrados</h2>
                    <p id="contador">0 registros</p>
                </div>
                <button id="btnLimpar" class="btn-danger" type="button">Limpar registros</button>
            </div>

            <div id="listaGastos" class="lista"></div>

            <div id="mensagemVazia" class="vazio">
                Nenhum gasto cadastrado ainda.
            </div>
        </section>

        <section class="total">
            <span>Total dos gastos</span>
            <strong id="totalGastos">R$ 0,00</strong>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
